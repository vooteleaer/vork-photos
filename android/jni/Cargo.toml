[package]
name = "vork-photos-jni"
description = "vØrk Photos for Android: the photos core to Kotlin, through JNI, as JSON"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "vork_photos"
crate-type = ["cdylib"]

[dependencies]
vork-photos-core = { path = "../../core" }
jni = { version = "0.21", default-features = false }
serde_json = "1"
libvork = { path = "../../../vork-storage/crates/libvork" }
