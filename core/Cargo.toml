[package]
name = "vork-photos-core"
description = "Photos on vØrk storage: pictures, their thumbnails, albums and the people in them (ADR-0024, ADR-0026), through libvork"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
libvork = { path = "../../vork-storage/crates/libvork" }
# Describing a picture imported here, as the extractor would (ADR-0023, ADR-0026).
vork-extract = { path = "../../vork-storage/crates/vork-extract" }
tokio = { version = "1", features = ["rt"] }
