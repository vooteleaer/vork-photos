[package]
name = "vork-photos-gtk"
description = "vØrk Photos for Linux: a GTK 4 / libadwaita front end"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "vork-photos"
path = "src/main.rs"

[dependencies]
vork-photos-core = { path = "../core" }
gtk = { package = "gtk4", version = "0.10", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.8", features = ["v1_4"] }
